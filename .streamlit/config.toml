[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 10
fileWatcherType = "none"

[theme]
baseRadius = "small"
buttonRadius = "small"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap, Georgia, serif"
headingFontWeights = 600

[theme.light]
primaryColor = "#C92A10"
backgroundColor = "#F4EEE1"
secondaryBackgroundColor = "#E9E1CF"
textColor = "#111111"
borderColor = "#B9AF9B"

[theme.dark]
primaryColor = "#FF6B4A"
backgroundColor = "#11100E"
secondaryBackgroundColor = "#1E1B17"
textColor = "#F4EEE1"
borderColor = "#3A352D"
